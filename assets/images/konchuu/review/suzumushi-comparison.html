<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コオロギとスズムシの画像比較</title><style>body{font:18px/1.6 sans-serif;margin:24px;background:#fff8df}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{padding:16px;background:white}img{width:100%;height:320px;object-fit:contain;background-color:#ddd;background-image:conic-gradient(#eee 25%,white 0 50%,#eee 0 75%,white 0);background-size:24px 24px}@media(max-width:800px){main{grid-template-columns:1fr}}</style><h1>コオロギとスズムシの画像比較</h1><p>スズムシは雄の前翅の形・翅脈と脚の色を修正しています。コオロギは比較用の既存画像です。</p><main><article><h2>コオロギ</h2><img src="../zukan/koorogi.png"><p>茶色い体、細長い前翅。</p></article><article><h2>スズムシ：修正前</h2><img src="suzumushi-before.png"><p>コオロギに近い細長い前翅。</p></article><article><h2>スズムシ：修正後</h2><img src="../zukan/suzumushi.png"><p>雄の幅広く丸みのある前翅、黒い体と淡い脚。</p><img src="../quiz/suzumushi.png"><p>クイズの丸は翅の特徴部分に合わせています。</p></article></main></html>
