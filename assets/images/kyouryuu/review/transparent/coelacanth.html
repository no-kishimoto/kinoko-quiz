<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シーラカンスの かくにん</title>
<style>
:root{color-scheme:light;--stage:#d7efff}
*{box-sizing:border-box}
body{margin:0;background:#fff8dd;color:#101820;font-family:system-ui,sans-serif}
main{max-width:1200px;margin:auto;padding:22px}
h1{font-size:30px;margin:0 0 12px}
p{line-height:1.7;margin:8px 0}
.description{padding:16px 20px;border:3px solid #39a2cc;border-radius:16px;background:#e8f7ff;font-size:26px;font-weight:600;margin-bottom:18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
figure{margin:0;background:white;padding:14px;border:2px solid #dcc88b;border-radius:18px}
figcaption{font-size:23px;font-weight:bold;margin-bottom:10px}
.stage{height:330px;background:var(--stage);border-radius:12px;overflow:hidden;border:1px solid #a3aab0}
img{width:100%;height:100%;object-fit:contain}
.notes{font-size:16px}
nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
button{font:inherit;font-size:18px;padding:10px 16px;border:2px solid #6a7685;border-radius:12px;background:white;color:#101820;cursor:pointer}
button[aria-pressed="true"]{border-color:#0076a8;box-shadow:0 0 0 2px #0076a8}
body.checker .stage{background:conic-gradient(#eee 25%,white 0 50%,#eee 0 75%,white 0);background-size:24px 24px}
a{color:#006497}
@media(max-width:650px){main{padding:14px}.pair{grid-template-columns:1fr}.stage{height:250px}.description{font-size:22px}h1{font-size:26px}}
</style>
</head>
<body>
<main>
<h1>シーラカンス</h1>
<section class="description" aria-label="せつめい">
むかしから いる さかなの なかま。いまも うみに すんでいるよ。ふとい ひれを うごかして およぐよ。
</section>
<div class="pair">
<figure>
<figcaption>もんだいの がぞう：こっかく</figcaption>
<div class="stage"><img src="coelacanth-fossil-v2.png" alt="シーラカンスの こっかく イラスト"></div>
</figure>
<figure>
<figcaption>こたえた あとの がぞう：いきている すがた</figcaption>
<div class="stage"><img src="coelacanth-reconstruction-v2.png" alt="あおい シーラカンスの ふくげん イラスト"></div>
</figure>
</div>
<nav aria-label="はいけいの いろ">
<button data-bg="#d7efff" aria-pressed="true">あお</button>
<button data-bg="#ffffff" aria-pressed="false">しろ</button>
<button data-bg="#263445" aria-pressed="false">くらい いろ</button>
<button data-bg="checker" aria-pressed="false">とうめいを かくにん</button>
</nav>
<p class="notes">せつめいと 2まいの がぞうは かくにんずみです。ゲームには まだ はんえいしていません。</p>
<p class="notes">しゃしんではなく、しりょうを もとに つくった イラストです。こっかくは なんこつなどの ぶぶんも おぎなっています。</p>
<p class="notes">しりょう：<a href="https://ocean.si.edu/ocean-life/fish/coelacanth">Smithsonian</a>・<a href="https://australian.museum/learn/animals/fishes/coelacanth-latimeria-chalumnae-smith-1939/">Australian Museum</a></p>
<p><a href="additions.html">ついかする 8しゅるいの いちらんへ</a>・<a href="index.html">かくにんずみの 10しゅるいへ</a></p>
</main>
<script>
document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 const bg=button.dataset.bg;
 document.body.classList.toggle('checker',bg==='checker');
 if(bg!=='checker')document.documentElement.style.setProperty('--stage',bg);
}));
</script>
</body>
</html>
