<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ついかする 8しゅるいの かくにん</title>
<style>
:root{color-scheme:light;--stage:#d7efff}
*{box-sizing:border-box}
body{margin:0;background:#fff8dd;color:#101820;font-family:system-ui,sans-serif}
header{padding:18px 24px;background:#fff8dd;border-bottom:2px solid #e3c677}
h1{font-size:28px;margin:0 0 10px}
p{line-height:1.7;margin:8px 0}
nav{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
button,.jump a{font:inherit;font-size:17px;padding:9px 14px;border:2px solid #6a7685;border-radius:12px;background:white;color:#101820;cursor:pointer;text-decoration:none}
button[aria-pressed="true"]{border-color:#0076a8;box-shadow:0 0 0 2px #0076a8}
.jump a{border-color:#d4bc72}
main{max-width:1240px;margin:auto;padding:20px}
article{margin:0 0 24px;padding:18px;background:white;border:2px solid #dbc78b;border-radius:18px;scroll-margin-top:12px}
h2{font-size:27px;margin:0 0 12px}
.description{font-size:24px;font-weight:600;padding:14px 18px;border-radius:12px;background:#e8f7ff;border:2px solid #39a2cc;margin-bottom:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
figure{margin:0}
figcaption{font-size:21px;font-weight:700;margin:0 0 8px}
.stage{height:310px;background:var(--stage);border-radius:12px;border:1px solid #9ca8af;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain}
body.checker .stage{background:conic-gradient(#eee 25%,white 0 50%,#eee 0 75%,white 0);background-size:24px 24px}
.note{font-size:16px;color:#314658}
.sources{display:flex;flex-wrap:wrap;gap:12px;font-size:15px}
a{color:#006497}
.toplink{display:inline-block;margin-top:10px}
@media(max-width:650px){header{padding:14px}main{padding:12px}article{padding:12px}.pair{grid-template-columns:1fr}.stage{height:250px}.description{font-size:21px}h1{font-size:25px}h2{font-size:24px}}
</style>
</head>
<body>
<header id="top">
<h1>ついかする 8しゅるいの かくにん</h1>
<p>せつめい・こっかく／かせき・いきていた すがたを、まとめて かくにんできます。</p>
<p class="note">8しゅるいの せつめいと がぞうを すべて かくにんずみです。ゲームには まだ はんえいしていません。</p>
<p class="note">がぞうは しりょうを もとに つくった イラストで、じっさいの ひょうほんの しゃしんでは ありません。</p>
<nav aria-label="はいけいの いろ">
<button data-bg="#d7efff" aria-pressed="true">あお</button>
<button data-bg="#ffffff" aria-pressed="false">しろ</button>
<button data-bg="#263445" aria-pressed="false">くらい いろ</button>
<button data-bg="checker" aria-pressed="false">とうめいを かくにん</button>
</nav>
<nav id="jump" class="jump" aria-label="しゅるいを えらぶ"></nav>
</header>
<main id="gallery" aria-live="polite"><p>よみこみちゅう…</p></main>
<script>
document.querySelectorAll('[data-bg]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 const bg=button.dataset.bg;
 document.body.classList.toggle('checker',bg==='checker');
 if(bg!=='checker')document.documentElement.style.setProperty('--stage',bg);
}));
async function build(){
 const response=await fetch('additions-review.json');
 if(!response.ok)throw new Error('いちらんを よみこめませんでした。');
 const review=await response.json();
 const gallery=document.getElementById('gallery');
 const jump=document.getElementById('jump');
 gallery.replaceChildren();
 review.items.forEach((entry,index)=>{
  const link=document.createElement('a');link.href='#'+entry.key;link.textContent=entry.name;jump.append(link);
  const article=document.createElement('article');article.id=entry.key;
  const title=document.createElement('h2');title.textContent=(index+1)+' / '+review.items.length+'　'+entry.name;article.append(title);
  const description=document.createElement('p');description.className='description';description.textContent=entry.zukan_text;article.append(description);
  const pair=document.createElement('div');pair.className='pair';
  for(const [label,path] of [['もんだいの がぞう：'+entry.specimen_label,entry.specimen_image],['こたえた あとの がぞう：ふくげん',entry.reconstruction_image]]){
   const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=label;
   const stage=document.createElement('div');stage.className='stage';const img=document.createElement('img');img.src=path;img.alt=entry.name+' '+label;
   stage.append(img);figure.append(caption,stage);pair.append(figure);
  }
  article.append(pair);
  const note=document.createElement('p');note.className='note';note.textContent=entry.review_note;article.append(note);
  const sources=document.createElement('p');sources.className='sources';
  entry.source_urls.forEach((url,i)=>{const a=document.createElement('a');a.href=url;a.textContent='しりょう '+(i+1);sources.append(a);});article.append(sources);
  const top=document.createElement('a');top.href='#top';top.className='toplink';top.textContent='いちらんの うえへ';article.append(top);gallery.append(article);
 });
 if(location.hash)document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView({block:'start'});
}
build().catch(error=>{document.getElementById('gallery').textContent=error.message;});
</script>
</body>
</html>
