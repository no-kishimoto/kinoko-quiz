const key='kinoko-image-review-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){document.getElementById('count').textContent+='（メモの保存には書き出しを使ってください）'}}
function picture(path,name){const a=document.createElement('a');a.href='../../'+path;a.className='picture';const i=document.createElement('img');i.src=a.href;i.alt=name;i.loading='lazy';i.onerror=()=>{i.onerror=null;i.alt=name+'（画像がありません。assetsフォルダの配置を確認してください）'};a.append(i);a.onclick=e=>{e.preventDefault();document.getElementById('zoom-title').textContent=name;document.getElementById('zoom-image').src=i.src;document.getElementById('zoom').showModal()};return a}
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),subject=document.getElementById('subject').value,status=document.getElementById('status').value;const rows=records.filter(r=>(subject==='all'||r.subject===subject)&&(status==='all'||(saved[r.key]?.status||r.initial)===status)&&[r.name,r.key,r.features,r.hint].join(' ').toLowerCase().includes(term));const gallery=document.getElementById('gallery');gallery.replaceChildren();for(const r of rows){const a=document.createElement('article');a.dataset.key=r.key;if(r.key==='suzumushi')a.className='important';const heading=document.createElement('h2');heading.textContent=r.label+' '+r.number+'. '+r.name;a.append(heading,picture(r.source,r.name+' 原画'));const hint=picture(r.quiz,r.name+' ヒント画像');hint.classList.add('hint');a.append(hint);const text=document.createElement('p');text.className='meta';text.textContent=r.features+' ／ ヒント：'+r.hint;a.append(text);if(r.key==='suzumushi'){const p=document.createElement('p');p.textContent='要再確認：前翅全体の輪郭を、おにぎり型のような丸みのある三角形か実物写真と照合。';a.append(p)}const select=document.createElement('select');select.className='review';select.setAttribute('aria-label',r.name+'の確認状況');for(const t of ['未確認','気になる','確認済み']){const o=document.createElement('option');o.textContent=t;select.append(o)}select.value=saved[r.key]?.status||r.initial;const memo=document.createElement('textarea');memo.className='memo';memo.placeholder='部位・気になる点・参考写真のURL';memo.setAttribute('aria-label',r.name+'の確認メモ');memo.value=saved[r.key]?.memo||'';select.onchange=()=>{saved[r.key]={status:select.value,memo:memo.value};persist()};memo.oninput=()=>{saved[r.key]={status:select.value,memo:memo.value};persist()};a.append(select,memo);gallery.append(a)}document.getElementById('count').textContent=rows.length+' / 99種類を表示'}
for(const id of ['search','subject','status'])document.getElementById(id).addEventListener('input',render);document.getElementById('hints').onchange=e=>document.body.classList.toggle('show-hints',e.target.checked);document.getElementById('close').onclick=()=>document.getElementById('zoom').close();document.getElementById('export').onclick=()=>{const rows=records.map(r=>({分野:r.label,名前:r.name,確認状況:saved[r.key]?.status||r.initial,メモ:saved[r.key]?.memo||''}));const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='画像の確認メモ.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
